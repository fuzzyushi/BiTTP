# BiTTP main hyperparameters (manuscript Table 3)
gat_layers: 2
gat_heads: 4
hidden_dim: 256
embed_dim: 768
infonce_temperature: 0.07
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.1
train_batch_size: 32
grad_accum: 3
finetune_epochs: 6
learning_rate: 1.0e-5
weight_decay: 0.01
retrieval_top_k: 5
aggregator_params: "0.59M"
aggregator_epochs: 10
aggregator_lr: 1.0e-3
tau_c: 0.90
tau_r: 0.82
self_training_rounds: 3
consensus_temperatures: [0.4, 0.6, 0.8]
alignment_epochs: 30
alignment_lr: 3.0e-4
definition_encoder: "sentence-transformers/all-MiniLM-L6-v2"
reasoning_backbone: "Llama-3.2-11B-Instruct"
